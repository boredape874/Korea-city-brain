name: Deploy City Brain to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: road-cache
        with:
          path: web/roads.json
          key: jangyu-osm-roads-v1
      - name: Fetch actual Jangyu road geometry
        if: steps.road-cache.outputs.cache-hit != 'true'
        run: python3 fetch_roads.py
      - name: Test Python adapter
        run: python3 -m unittest -v
      - name: Test traffic experiment
        run: node test_simulation.cjs
      - name: Test actual OSM network
        run: node test_real_network.cjs
      - name: Test dashboard wiring
        run: node test_app.cjs
      - name: Prepare static demo
        run: cp data/demo.json web/demo.json
      - name: Collect official traffic snapshot
        env:
          ITS_API_KEY: ${{ secrets.ITS_API_KEY }}
        run: python3 collect_snapshot.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build versioned static assets
        run: python3 build_static.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
